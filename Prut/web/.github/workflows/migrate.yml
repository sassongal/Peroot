name: Database Migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

# The app (and the db:migrate script) live in Prut/web, not the repo root.
defaults:
  run:
    working-directory: Prut/web

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Prut/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual runs apply only the single pending migration and verify it
            # against the live DB — surgical and safe to re-run.
            node scripts/apply-and-verify-migration.mjs
          else
            # Push to main runs the full idempotent migration set.
            npm run db:migrate
          fi
