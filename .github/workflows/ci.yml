name: CI

# Quality gate for the Next.js app (Prut/web). Runs on every push to main and on
# every PR targeting main. `quality` needs no secrets and is the check to require
# in branch protection — it catches the type errors that have broken `main`
# before. `build` compiles the app for real, which is the only thing that catches
# breakage that only shows up at build time (prerendering, route collection).
#
# Node version comes from Prut/web/.nvmrc so CI, local dev and Vercel stay on one
# version instead of drifting (they were on 20 / 22 / 24 respectively).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Prut/web

jobs:
  quality:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    # Dummy values so any imported module that runs env-validation doesn't throw
    # during unit tests. Tests must not hit real services (they are mocked).
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Prut/web/.nvmrc
          cache: npm
          cache-dependency-path: Prut/web/package-lock.json
      - name: Install
        run: npm ci
      # Hard gate: the two errors that have broken main before were both type
      # errors, so tsc is the essential check. Tests guard behaviour regressions.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test
      # Informational for now — the repo has ~41 pre-existing eslint errors that
      # the per-file pre-commit hook never enforced repo-wide. Clear that debt,
      # then remove `continue-on-error` to make lint a hard gate too.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npx eslint src

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality
    # Prerendered public pages (/templates, /prompts, /blog, the sitemap) read
    # the catalog through createServiceClient(). No service-role key belongs in
    # a PUBLIC repo's Actions secrets, so the build runs those reads with the
    # ANON key in that slot: every table they touch has a public SELECT policy,
    # so the pages render under RLS exactly as an anonymous visitor would see
    # them, and the gate stays real. Since 2026-09-01 (root layout no longer
    # dynamic) these pages are prerendered at build, and a placeholder string
    # here failed every build with library_load_failed.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Prut/web/.nvmrc
          cache: npm
          cache-dependency-path: Prut/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
